<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador WH40k - Montecarlo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- PropTypes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0f172a] text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            LineChart, Line, AreaChart, Area, ReferenceLine, LabelList, Label, Cell
        } = Recharts;

        const WH40K_FACTIONS = [
            "Adepta Sororitas", "Adeptus Astartes", "Adeptus Custodes", "Adeptus Mechanicus", 
            "Astra Militarum", "Caballeros del Caos", "Caballeros Grises", "Caballeros Imperiales", 
            "Cultos Genestealer", "Demonios del Caos", "Devoradores de Mundos", "Drukhari", 
            "Eldar (Aeldari)", "Guardia de la Muerte", "Imperio T'au", "Ligas de Votann", 
            "Marines Espaciales del Caos", "Mil Hijos", "Necrones", "Orkos", "Tiránidos"
        ];

        const InputSelect = ({ label, name, value, onChange, options }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-1/3">{label}</label>
                <select 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    className="w-2/3 bg-gray-900 text-white rounded p-1 text-sm border border-gray-700 focus:border-blue-500 focus:outline-none"
                >
                    {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                </select>
            </div>
        );

        const InputText = ({ label, name, value, onChange }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-1/3">{label}</label>
                <input 
                    type="text" 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    className="w-2/3 bg-gray-900 text-white rounded p-1 text-sm border border-gray-700 focus:border-blue-500 focus:outline-none"
                />
            </div>
        );

        const InputNumber = ({ label, name, value, onChange, min = 0, max = 100 }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-2/3">{label}</label>
                <input 
                    type="number" 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    min={min}
                    max={max}
                    className="w-1/3 bg-gray-900 text-white rounded p-1 text-center font-mono border border-gray-700 focus:border-blue-500 focus:outline-none"
                />
            </div>
        );

        const Checkbox = ({ label, name, checked, onChange }) => (
            <label className="flex items-center space-x-3 cursor-pointer bg-gray-800 p-2 rounded-lg hover:bg-gray-700 transition-colors">
                <div className="relative flex items-center">
                    <input 
                        type="checkbox" 
                        name={name} 
                        checked={checked} 
                        onChange={onChange}
                        className="peer sr-only" 
                    />
                    <div className="w-5 h-5 bg-gray-900 border border-gray-600 rounded peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-colors flex items-center justify-center">
                        {checked && <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
                    </div>
                </div>
                <span className="text-sm text-gray-300 font-medium">{label}</span>
            </label>
        );

        function App() {
            const [params, setParams] = useState({
                attacker_faction: "Necrones",
                attacker_name: "Lokhust Destroyers (Buffs)",
                defender_faction: "Tiránidos",
                defender_name: "Norn Emissary",
                n_models: 6,
                attacks_per_model: 3,
                bs: 3,
                wound_target: 5,
                save_target: 4,
                invuln_target: 4,
                ap: -2,
                damage: 2,
                target_wounds: 16,
                hit_modifier: -1,
                wound_modifier: 0,
                damage_modifier: 0,
                critical_hit_threshold: 5,
                critical_wound_threshold: 6,
                has_lethal_hits: true,
                sustained_hits_value: 1,
                has_devastating_wounds: false,
                fnp_target: 7,
                reroll_hits: true,
                reroll_hits_1: false,
                reroll_wounds: false,
                reroll_wounds_1: false
            });

            const [simResults, setSimResults] = useState(null);
            const [aiReport, setAiReport] = useState("");
            const [isGeneratingAI, setIsGeneratingAI] = useState(false);

            const handleParamChange = (e) => {
                const { name, value, type, checked } = e.target;
                setParams(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : (type === 'number' ? Number(value) : value)
                }));
                setAiReport("");
            };

            const simulate = () => {
                const iterations = 50000;
                const {
                    n_models, attacks_per_model, bs, wound_target, save_target, invuln_target, ap,
                    damage, target_wounds, hit_modifier, wound_modifier, damage_modifier,
                    critical_hit_threshold, critical_wound_threshold, has_lethal_hits,
                    sustained_hits_value, has_devastating_wounds, fnp_target,
                    reroll_hits, reroll_hits_1, reroll_wounds, reroll_wounds_1
                } = params;

                const effective_bs = Math.max(2, Math.min(6, bs - hit_modifier));
                const effective_wound = Math.max(2, Math.min(6, wound_target - wound_modifier));
                const modified_save = save_target - (ap < 0 ? ap : -ap);
                const effective_save = Math.min(Math.max(2, modified_save), invuln_target);
                const effective_damage = Math.max(1, damage - damage_modifier);
                const total_attacks = n_models * attacks_per_model;

                let damageCounts = {};
                let killCounts = {};
                let totalDmgSum = 0;
                let maxDmg = 0;

                for (let i = 0; i < iterations; i++) {
                    let hits = 0;
                    let critical_hits = 0;

                    for (let a = 0; a < total_attacks; a++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (reroll_hits && roll < effective_bs && roll < critical_hit_threshold) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        } else if (reroll_hits_1 && roll === 1) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        }

                        if (roll >= critical_hit_threshold) {
                            critical_hits++;
                            hits++;
                        } else if (roll >= effective_bs) {
                            hits++;
                        }
                    }

                    let extra_hits = critical_hits * sustained_hits_value;
                    let normal_hits_pool = hits - critical_hits + extra_hits;
                    if (!has_lethal_hits) normal_hits_pool += critical_hits;
                    
                    let critical_wounds = 0;
                    let normal_wounds = 0;

                    for (let w = 0; w < normal_hits_pool; w++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (reroll_wounds && roll < effective_wound && roll < critical_wound_threshold) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        } else if (reroll_wounds_1 && roll === 1) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        }

                        if (roll >= critical_wound_threshold) {
                            critical_wounds++;
                        } else if (roll >= effective_wound) {
                            normal_wounds++;
                        }
                    }

                    let devastating_dmg_pool = has_devastating_wounds ? (critical_wounds * effective_damage) : 0;
                    let wounds_to_save = normal_wounds;
                    if (!has_devastating_wounds) wounds_to_save += critical_wounds;
                    if (has_lethal_hits) wounds_to_save += critical_hits;

                    let unsaved_wounds = 0;
                    for (let s = 0; s < wounds_to_save; s++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (roll < effective_save) {
                            unsaved_wounds++;
                        }
                    }

                    let normal_dmg_pool = unsaved_wounds * effective_damage;
                    let final_dmg = 0;
                    let total_dmg_to_fnp = normal_dmg_pool + devastating_dmg_pool;
                    
                    if (fnp_target <= 6) {
                        for (let d = 0; d < total_dmg_to_fnp; d++) {
                            let roll = Math.floor(Math.random() * 6) + 1;
                            if (roll < fnp_target) final_dmg++;
                        }
                    } else {
                        final_dmg = total_dmg_to_fnp;
                    }

                    let models_killed = 0;
                    let dmg_allocated = final_dmg;
                    
                    while (dmg_allocated >= target_wounds) {
                        models_killed++;
                        dmg_allocated -= target_wounds;
                    }

                    damageCounts[final_dmg] = (damageCounts[final_dmg] || 0) + 1;
                    killCounts[models_killed] = (killCounts[models_killed] || 0) + 1;
                    totalDmgSum += final_dmg;
                    if (final_dmg > maxDmg) maxDmg = final_dmg;
                }

                let killsData = [];
                let cumulativeKillsData = [];
                let cumProb = 0;
                const maxKillsChart = Math.max(...Object.keys(killCounts).map(Number));

                for (let k = maxKillsChart; k >= 0; k--) {
                    let count = killCounts[k] || 0;
                    let prob = count / iterations;
                    cumProb += prob;
                    
                    killsData.unshift({
                        killed: k,
                        prob: prob,
                        probDisplay: (prob * 100).toFixed(1) + "%"
                    });

                    cumulativeKillsData.unshift({
                        killed: k,
                        cumProb: cumProb,
                        cumProbDisplay: (cumProb * 100).toFixed(1) + "%"
                    });
                }

                let dmgData = [];
                for (let d = 0; d <= maxDmg; d++) {
                    dmgData.push({
                        dmg: d,
                        densidad: (damageCounts[d] || 0) / iterations
                    });
                }

                setSimResults({
                    avgDamage: totalDmgSum / iterations,
                    killsData,
                    cumulativeKillsData: cumulativeKillsData.sort((a,b) => a.killed - b.killed),
                    dmgData,
                    iterations
                });
            };

            useEffect(() => {
                const timer = setTimeout(() => { simulate(); }, 300);
                return () => clearTimeout(timer);
            }, [params]);

            const generateTacticalAnalysis = () => {
                setIsGeneratingAI(true);
                setAiReport("");

                setTimeout(() => {
                    const probKillOne = (simResults.cumulativeKillsData.find(d => d.killed === 1)?.cumProb || 0) * 100;
                    const maxKills = Math.max(...simResults.killsData.filter(d => d.prob > 0).map(d => d.killed));
                    const avgDmg = simResults.avgDamage.toFixed(2);
                    const faction = params.attacker_faction;
                    const target = params.defender_name;

                    let report = "";

                    // Diccionario de personalidades por facción y percentil (<25, 25-50, 50-75, >75)
                    const factionDict = {
                        "Orkos": {
                            low: `¡PULGARES ABAJO, XIKOS! ¿Un miserable ${probKillOne.toFixed(1)}% de probabilidad? ¡Hasta un Gretchin kon catarro pega más fuerte! Daño medio de ${avgDmg}. ¡El Kaudillo los va a hacer puré por pensar en un ataque tan penoso! ¡A korrer!`,
                            midLow: `Mmh... un ${probKillOne.toFixed(1)}% de que kaiga uno. Con ${avgDmg} de daño, es una apuesta arriesgada. Si la suerte nos acompaña, rompemos algo; si no, quedaremos komo idiotas. ¡Griten más fuerte antes de tirar los dados!`,
                            midHigh: `¡A HIIIIJOS DE GORKO! ¡Tenemos un ${probKillOne.toFixed(1)}% de asegurar bajas! Con un promedio de ${avgDmg} de daño, el ${target} va a kantar victoria tarde. ¡Hasta ${maxKills} modelos pueden caer si nos ponemos violentos! ¡WAAAGH!`,
                            high: `¡ESTO ES UNA MASACRE! ¡${probKillOne.toFixed(1)}% de probabilidad de destrozar al ${target}! ¡${avgDmg} de daño medio y hasta ${maxKills} bajas seguras! ¡Nadie sobrevive a esta paliza, xikos!`
                        },
                        "Necrones": {
                            low: `[ALERTA DE INCOMPETENCIA]: Una probabilidad del ${probKillOne.toFixed(1)}% es un insulto a las Dinastías. Daño medio de ${avgDmg}. Sus engramas están oxidados; este sector entero debería ser desintegrado por la vergüenza de su cálculo.`,
                            midLow: `Eficiencia subóptima. El ${probKillOne.toFixed(1)}% de probabilidad de baja indica resistencia imprevista del objetivo ${target}. Con ${avgDmg} de daño, es una pérdida de tiempo gauss.`,
                            midHigh: `Parámetros favorables. Un ${probKillOne.toFixed(1)}% de probabilidad de aniquilación y ${avgDmg} de daño garantizan que los protocolos de desintegración harán su trabajo sobre el ${target}.`,
                            high: `[EJECUCIÓN TOTAL]: Probabilidad del ${probKillOne.toFixed(1)}% de bajas. Daño medio destructivo de ${avgDmg}. El objetivo ${target} cesará de manera eficiente y absoluta bajo nuestro avance.`
                        },
                        "Adeptus Astartes": {
                            low: `¡Deshonra para el Capítulo! Con un escaso ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño medio, este asalto es un despropósito. El primarca lloraría al ver semejante flaqueza en el bólter. Reorganicen la línea.`,
                            midLow: `Las probabilidades no son favorables: ${probKillOne.toFixed(1)}% de certeza de baja y ${avgDmg} de daño medio. Proceder requiere fe ciega, pues el enemigo ${target} resistirá gran parte de la embestida.`,
                            midHigh: `Excelente desempeño táctico. Con un ${probKillOne.toFixed(1)}% de probabilidad de éxito y ${avgDmg} puntos de daño, purgarán al ${target} tal como fue ordenado. Hasta ${maxKills} bajas. Por el Emperador.`,
                            high: `¡La ira del Capítulo es implacable! ${probKillOne.toFixed(1)}% de probabilidad de aniquilación total y ${avgDmg} de daño medio. El ${target} será barrido de la faz del planeta. ¡Gloria al Imperio!`
                        },
                        "Tiránidos": {
                            low: `[Error Sináptico]: Biomasa recolectable insignificante (${probKillOne.toFixed(1)}% de éxito, ${avgDmg} daño). La Mente Enjambre rechaza este ataque por ineficiente. Desvíen el enjambre hacia presas más débiles.`,
                            midLow: `Resistencia tenaz detectada en ${target}. Eficacia de depredación del ${probKillOne.toFixed(1)}%. El daño proyectado (${avgDmg}) apenas rasguña la armadura enemiga. Se requiere adaptación.`,
                            midHigh: `Oleja de asalto lista. ${probKillOne.toFixed(1)}% de probabilidad de quiebre defensivo y ${avgDmg} de daño medio. Las fauces del enjambre desgarrarán al ${target} sin piedad.`,
                            high: `[Consumo Inminente]: ${probKillOne.toFixed(1)}% de probabilidad de aniquilación. Daño masivo de ${avgDmg}. La biomasa del ${target} será despojada hasta el último átomo. Adaptar, superar, devorar.`
                        },
                        "Adepta Sororitas": {
                            low: `¡Falta de fe! Un ${probKillOne.toFixed(1)}% de probabilidad y ${avgDmg} de daño demuestran tibieza en vuestras plegarias. ¡El bólter sagrado no disparará milagros sin una devoción auténtica!`,
                            midLow: `Las llamas de la fe titilan ante el ${target} (${probKillOne.toFixed(1)}% de éxito, ${avgDmg} daño). El martirio acecha si persisten en una ofensiva tan frágil.`,
                            midHigh: `¡El fuego purificador arde con fuerza! Con un ${probKillOne.toFixed(1)}% de probabilidad y ${avgDmg} de daño, las llamas del Emperador diezmarán las filas del ${target}.`,
                            high: `¡Milagro de combate! ${probKillOne.toFixed(1)}% de certeza de purga total con ${avgDmg} de daño sagrado. El enemigo arderá en la gloria de la Ekklesiarquía.`
                        },
                        "Adeptus Custodes": {
                            low: `Inaceptable para la Guardia del Trono. Un ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño menosprecian el oro de nuestra armadura. No mancharemos nuestras lanzas en vano.`,
                            midLow: `El objetivo ${target} demuestra una resiliencia inusual. Con ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño, la guardia debe evaluar si el esfuerzo merece la sangre de la élite.`,
                            midHigh: `Perfección marcial en marcha. ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. Las lanzas guardianas abrirán paso entre las defensas del ${target}.`,
                            high: `La voluntad del Emperador se ejecuta sin fallos. ${probKillOne.toFixed(1)}% de probabilidad de aniquilación absoluta y ${avgDmg} de daño. El ${target} caerá como paja ante la hoja de los Custodios.`
                        },
                        "Adeptus Mechanicus": {
                            low: `[Error 404 - Lógica Inválida]: Probabilidad de éxito del ${probKillOne.toFixed(1)}%. Salida de daño de ${avgDmg}. Los sagrados cánticos binarios desaprueban este cálculo ineficiente. Ajusten los servo-brazos.`,
                            midLow: `Resistencia del objetivo fuera de los parámetros óptimos (${probKillOne.toFixed(1)}% de éxito, ${avgDmg} daño). La Omnissiah aconseja recalibrar los algoritmos balísticos antes de disparar.`,
                            midHigh: `[Bendición del Dios Máquina]: ${probKillOne.toFixed(1)}% de probabilidad de éxito balístico, ${avgDmg} daño neto. Las líneas de fuego de los Skitarii desintegrarán al ${target}.`,
                            high: `[Cálculo Divino Absoluto]: Eficiencia del ${probKillOne.toFixed(1)}%, daño medio ${avgDmg}. La ira de la Omnissiah se manifestará en una obsolescencia forzada instantánea para el ${target}.`
                        },
                        "Astra Militarum": {
                            low: `¡Soldado, qué es esa porquería de ataque! ¡${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño! ¡La carne es prescindible, pero gastar munición del Emperador en vano es un delito castigado con ejecución!`,
                            midLow: `Las estadísticas del Regimiento no son prometedoras: ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño. Preparen las bayonetas, porque el enemigo sobrevivirá al cañón.`,
                            midHigh: `¡Fuego a discreción! ${probKillOne.toFixed(1)}% de probabilidad de éxito y ${avgDmg} de daño medio. Las filas del ${target} temblarán bajo el peso de nuestra artillería masiva.`,
                            high: `¡Descarga general coordinada! ${probKillOne.toFixed(1)}% de probabilidad de aniquilación y ${avgDmg} de daño demoledor. El ${target} quedará reducido a cráteres humeantes.`
                        },
                        "Caballeros del Caos": {
                            low: `¡Cobardes vinculados a la disformidad! Un ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño dan vergüenza a los Dioses Oscuros. ¡Merecéis ser transformados en cráneos parlantes!`,
                            midLow: `El favor de los Dioses es voluble hoy: ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño. El ${target} resiste con fastidiosa obstinación.`,
                            midHigh: `¡La Disformidad sonríe! ${probKillOne.toFixed(1)}% de probabilidad de destrucción y ${avgDmg} de daño medio. Los titanes del Caos pisotearán sin piedad al ${target}.`,
                            high: `¡Matanza gloriosa para los Poderes Ruinosos! ${probKillOne.toFixed(1)}% de certeza de aniquilación, ${avgDmg} de daño catastrófico. El ${target} sufrirá el terror absoluto.`
                        },
                        "Caballeros Grises": {
                            low: `La disformidad susurra dudas: ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño. Un asalto tan débil no logrará penetrar la corrupción del ${target}. Canalicen más psique.`,
                            midLow: `Resistencia psíquica detectada. Con ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño, el enemigo pondrá a prueba la pureza de nuestras hojas némesis.`,
                            midHigh: `Golpe psíquico certero: ${probKillOne.toFixed(1)}% de probabilidad de éxito y ${avgDmg} de daño medio. Desterradores listos para purgar al ${target} de la existencia.`,
                            high: `¡Fuerza de Aegis total! ${probKillOne.toFixed(1)}% de probabilidad de aniquilación y ${avgDmg} de daño. El ${target} será borrado por la voluntad combinada de los Caballeros Grises.`
                        },
                        "Caballeros Imperiales": {
                            low: `Un noble deshonor: ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño. Las grandes armas de la Casa no deben desperdiciarse en blancos tan esquivos.`,
                            midLow: `El trono de los Caballeros registra resistencia en el ${target} (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Ajusten los cañones termales para asegurar el honor.`,
                            midHigh: `¡Paso de titán autorizado! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. Las armaduras ancestrales aplastarán al ${target}.`,
                            high: `¡Juicio de la Caballería! ${probKillOne.toFixed(1)}% de certeza destructiva, ${avgDmg} de daño devastador. El ${target} no es más que polvo bajo nuestros pies de hierro.`
                        },
                        "Cultos Genestealer": {
                            low: `Hermanos de la Broca, el cálculo falla (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Si atacamos ahora alertaremos al Patriarca en vano. Manteneos en las sombras.`,
                            midLow: `Amboscuada con riesgo: ${probKillOne.toFixed(1)}% de probabilidad de éxito, ${avgDmg} de daño. El ${target} podría sobrevivir y descubrir nuestras redes subterráneas.`,
                            midHigh: `¡Por el Gran Pastor Estelar! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño. Las sombras vomitarán insurgentes sobre el ${target}.`,
                            high: `¡El Levantamiento ha llegado! ${probKillOne.toFixed(1)}% de probabilidad de masacre total, ${avgDmg} de daño. El ${target} caerá desde adentro en una marea de fervor xenomorfo.`
                        },
                        "Demonios del Caos": {
                            low: `¡Insulsos mortales! Un ${probKillOne.toFixed(1)}% de probabilidad y ${avgDmg} de daño apenas alimentan el apetito del Caos. ¡Merecéis volver al Warp disueltos en pena!`,
                            midLow: `Las corrientes disformes fluyen débiles: ${probKillOne.toFixed(1)}% de éxito, ${avgDmg} de daño. El ${target} mantiene su cordura ante nuestra manifestación.`,
                            midHigh: `¡Garras y colmillos disformes! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. La locura se cernirá sobre las líneas del ${target}.`,
                            high: `¡Marea demoníaca desatada! ${probKillOne.toFixed(1)}% de certeza destructiva, ${avgDmg} de daño abismal. El ${target} será devorado en cuerpo y alma por la Disformidad.`
                        },
                        "Devoradores de Mundos": {
                            low: `¡SANGRE PARA EL DIOS DE LA SANGRE! ...pero con ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} daño nos da risa. ¡Más les vale gritar más fuerte o el Clavos de Carnicería os matará antes!`,
                            midLow: `La masacre se atasca: ${probKillOne.toFixed(1)}% de probabilidad de éxito, ${avgDmg} de daño. El ${target} se niega a desangrarse con la velocidad requerida.`,
                            midHigh: `¡A POR SUS CRÁNEOS! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. Las hachas carniceras abrirán en canal al ${target}.`,
                            high: `¡MASACRE ABSOLUTA! ${probKillOne.toFixed(1)}% de probabilidad de destrucción total, ${avgDmg} de daño letal. ¡SKULLS FOR THE SKULL THRONE! ¡El ${target} es carne muerta!`
                        },
                        "Drukhari": {
                            low: `Qué aburrimiento... Un ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño. Esto no generará suficiente dolor ni agonía para alimentar a Commorragh. Busquemos otra víctima.`,
                            midLow: `Presa escurridiza detectada (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Las espinas venenosas del ${target} podrían arruinar nuestros Raiders si fallamos.`,
                            midHigh: `¡Redadas de dolor exitosas! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. Los colmaderos de Commorragh disfrutarán la agonía del ${target}.`,
                            high: `¡Cosecha de almas perfecta! ${probKillOne.toFixed(1)}% de probabilidad de destrucción, ${avgDmg} de daño atroz. El ${target} deseará no haber nacido jamás.`
                        },
                        "Eldar (Aeldari)": {
                            low: `Los hilos del Fata revelan un futuro sombrío: ${probKillOne.toFixed(1)}% de éxito, ${avgDmg} de daño. Este camino conduce a nuestra propia ruina; evítenlo.`,
                            midLow: `El tapiz temporal muestra resistencia en el ${target} (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Cada baja costará más de lo previsto por los videntes.`,
                            midHigh: `Predicción favorable de los Caminos: ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. La gracia y velocidad aeldari superarán al ${target}.`,
                            high: `[Triunfo del Vidente]: ${probKillOne.toFixed(1)}% de probabilidad de aniquilación impecable, ${avgDmg} de daño letal. El ${target} caerá antes de comprender su propio destino.`
                        },
                        "Guardia de la Muerte": {
                            low: `La pestilencia fluye lenta y débil (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). El abuelo Nurgle os pide más paciencia y corrupción para pudrir al ${target}.`,
                            midLow: `El ciclo de descomposición tropieza: ${probKillOne.toFixed(1)}% de probabilidad de baja, ${avgDmg} de daño. Las bendiciones de Nurgle tardarán en hacer efecto en el ${target}.`,
                            midHigh: `La marcha implacable avanza: ${probKillOne.toFixed(1)}% de probabilidad de éxito y ${avgDmg} de daño medio. Las toxinas erosionarán la armadura del ${target}.`,
                            high: `¡Gloriosa putrefacción! ${probKillOne.toFixed(1)}% de probabilidad de destrucción total, ${avgDmg} de daño tóxico letal. El ${target} se disolverá en fango bendito por Nurgle.`
                        },
                        "Imperio T'au": {
                            low: `[Análisis T'au - Subóptimo]: Probabilidad de éxito del ${probKillOne.toFixed(1)}%, daño medio ${avgDmg}. El Bien Supremo no se alcanza arriesgando recursos en ataques de baja rentabilidad estadística.`,
                            midLow: `Resistencia enemiga alta detectada por los sensores (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Se recomienda reposicionar los marcadores lumínicos antes de abrir fuego.`,
                            midHigh: `[Fuego Concentrado Autorizado]: ${probKillOne.toFixed(1)}% de probabilidad de baja, ${avgDmg} de daño medio. Las castas de fuego desintegrarán al ${target} con precisión matemática.`,
                            high: `[Superioridad del Bien Supremo]: ${probKillOne.toFixed(1)}% de probabilidad de aniquilación total, ${avgDmg} de daño perfecto. El ${target} sucumbirá ante la doctrina óptima T'au.`
                        },
                        "Ligas de Votann": {
                            low: `¡Eso va directo al Gran Libro de los Rencores! ${probKillOne.toFixed(1)}% de éxito, ${avgDmg} de daño. ¡Imbéciles, con esos números el ${target} se está riendo de nuestra barbas!`,
                            midLow: `Cálculo de clan poco rentable (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Los ancestros no están complacidos con la baja calidad de esta emboscada kin.`,
                            midHigh: `¡Por los Ancestros! ${probKillOne.toFixed(1)}% de probabilidad de baja y ${avgDmg} de daño medio. La tecnología de los Votann perforará las defensas del ${target}.`,
                            high: `¡Sentencia de Rencor ejecutada! ${probKillOne.toFixed(1)}% de probabilidad de destrucción absoluta, ${avgDmg} de daño masivo. El ${target} ha pagado su deuda con sangre kin.`
                        },
                        "Marines Espaciales del Caos": {
                            low: `¡Patéticos esclavos de la ruina! Un ${probKillOne.toFixed(1)}% de éxito y ${avgDmg} de daño demuestran que habéis perdido el favor del Caos. ¡Merecéis morir a manos del enemigo!`,
                            midLow: `Fuerza de choque comprometida: ${probKillOne.toFixed(1)}% de probabilidad de baja, ${avgDmg} de daño. El ${target} resiste con fastidiosa obstinación leal.`,
                            midHigh: `¡Por el Señor de la Guerra! ${probKillOne.toFixed(1)}% de probabilidad de éxito y ${avgDmg} de daño medio. Romperemos las líneas del ${target} sin contemplaciones.`,
                            high: `¡Dominio total de la Herejía! ${probKillOne.toFixed(1)}% de probabilidad de masacre absoluta, ${avgDmg} de daño letal. El ${target} sufrirá la furia de los veteranos del Ojo.`
                        },
                        "Mil Hijos": {
                            low: `[Cálculo Arcano Fallido]: Una probabilidad del ${probKillOne.toFixed(1)}% y ${avgDmg} de daño muestran un flujo disforme errático. Tzeentch se burla de vuestra escasa magia.`,
                            midLow: `Resistencia mental del ${target} elevada (${probKillOne.toFixed(1)}% éxito, ${avgDmg} daño). Los Rubricae requieren un ritual psíquico más potente para surtir efecto.`,
                            midHigh: `[Hechizo de Destrucción]: ${probKillOne.toFixed(1)}% de probabilidad de éxito, ${avgDmg} de daño medio. Las llamas mutágenas envolverán por completo al ${target}.`,
                            high: `[Dominio del Mutruo Tzeentchiano]: ${probKillOne.toFixed(1)}% de probabilidad de aniquilación mágica, ${avgDmg} de daño abrumador. La realidad del ${target} se desvanecerá en cenizas.`
                        }
                    };

                    // Seleccionar según el percentil de probabilidad de baja (0-25, 25-50, 50-75, 75-100)
                    const currentFactionObj = factionDict[faction] || factionDict["Necrones"];
                    if (probKillOne < 25) {
                        report = currentFactionObj.low;
                    } else if (probKillOne >= 25 && probKillOne < 50) {
                        report = currentFactionObj.midLow;
                    } else if (probKillOne >= 50 && probKillOne < 75) {
                        report = currentFactionObj.midHigh;
                    } else {
                        report = currentFactionObj.high;
                    }

                    setAiReport(report);
                    setIsGeneratingAI(false);
                }, 600);
            };

            if (!simResults) return <div className="min-h-screen bg-gray-950 text-white flex items-center justify-center font-mono">Cargando Motores de Lógica...</div>;

            return (
                <div className="min-h-screen bg-[#0f172a] text-gray-100 flex flex-col md:flex-row font-sans">
                    {/* SIDEBAR */}
                    <div className="w-full md:w-80 bg-gray-900 border-r border-gray-800 p-4 h-auto md:h-screen overflow-y-auto shrink-0 shadow-2xl z-10">
                        <h1 className="text-xl font-bold text-white mb-6 tracking-tight flex items-center gap-2 border-b border-gray-800 pb-4">
                            <i data-lucide="activity" className="text-blue-500 w-5 h-5"></i>
                            Simulador Montecarlo
                        </h1>

                        <div className="space-y-6">
                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="crosshair" className="w-4 h-4"></i> Atacante
                                </h2>
                                <InputSelect label="Facción Atacante" name="attacker_faction" value={params.attacker_faction} onChange={handleParamChange} options={WH40K_FACTIONS} />
                                <InputText label="Nombre Unidad" name="attacker_name" value={params.attacker_name} onChange={handleParamChange} />
                                <InputNumber label="Num. Modelos" name="n_models" value={params.n_models} onChange={handleParamChange} min={1} />
                                <InputNumber label="Ataques c/u" name="attacks_per_model" value={params.attacks_per_model} onChange={handleParamChange} min={1} />
                                <InputNumber label="HA/HP (BS/WS)" name="bs" value={params.bs} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Daño" name="damage" value={params.damage} onChange={handleParamChange} min={1} />
                                <InputNumber label="AP (Penetración)" name="ap" value={params.ap} onChange={handleParamChange} />
                            </div>

                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="shield" className="w-4 h-4"></i> Defensor
                                </h2>
                                <InputSelect label="Facción Defensora" name="defender_faction" value={params.defender_faction} onChange={handleParamChange} options={WH40K_FACTIONS} />
                                <InputText label="Nombre Unidad" name="defender_name" value={params.defender_name} onChange={handleParamChange} />
                                <InputNumber label="Tirada Herir" name="wound_target" value={params.wound_target} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Salvación Base" name="save_target" value={params.save_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Invulnerable" name="invuln_target" value={params.invuln_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Feel No Pain" name="fnp_target" value={params.fnp_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Heridas c/u" name="target_wounds" value={params.target_wounds} onChange={handleParamChange} min={1} />
                            </div>

                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="zap" className="w-4 h-4"></i> Reglas y Buffs
                                </h2>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <InputNumber label="Mod. Impacto" name="hit_modifier" value={params.hit_modifier} onChange={handleParamChange} min={-1} max={1} />
                                    <InputNumber label="Mod. Herir" name="wound_modifier" value={params.wound_modifier} onChange={handleParamChange} min={-1} max={1} />
                                </div>
                                <InputNumber label="Crítico Impacto" name="critical_hit_threshold" value={params.critical_hit_threshold} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Crítico Herir" name="critical_wound_threshold" value={params.critical_wound_threshold} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Sustained Hits" name="sustained_hits_value" value={params.sustained_hits_value} onChange={handleParamChange} min={0} />
                                
                                <div className="pt-2 space-y-2">
                                    <Checkbox label="Lethal Hits" name="has_lethal_hits" checked={params.has_lethal_hits} onChange={handleParamChange} />
                                    <Checkbox label="Devastating Wounds" name="has_devastating_wounds" checked={params.has_devastating_wounds} onChange={handleParamChange} />
                                    <Checkbox label="Full Reroll Impactos" name="reroll_hits" checked={params.reroll_hits} onChange={handleParamChange} />
                                    <Checkbox label="Reroll Impactos de 1" name="reroll_hits_1" checked={params.reroll_hits_1} onChange={handleParamChange} />
                                    <Checkbox label="Full Reroll Heridas" name="reroll_wounds" checked={params.reroll_wounds} onChange={handleParamChange} />
                                    <Checkbox label="Reroll Heridas de 1" name="reroll_wounds_1" checked={params.reroll_wounds_1} onChange={handleParamChange} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 p-4 md:p-8 overflow-y-auto w-full">
                        <div className="mb-8">
                            <h2 className="text-2xl md:text-3xl font-extrabold text-white mb-2">
                                {params.n_models}x {params.attacker_name} vs {params.defender_name}
                            </h2>
                            <p className="text-gray-400">
                                Basado en {simResults.iterations.toLocaleString()} iteraciones procesadas de forma nativa.
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Daño Medio Esperado</p>
                                        <p className="text-3xl font-bold text-blue-400">{simResults.avgDamage.toFixed(2)}</p>
                                    </div>
                                    <i data-lucide="activity" className="text-blue-500/20 w-12 h-12"></i>
                                </div>
                                
                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Prob. de Baja (≥1)</p>
                                        <p className="text-3xl font-bold text-teal-400">
                                            {((simResults.cumulativeKillsData.find(d => d.killed === 1)?.cumProb || 0) * 100).toFixed(1)}%
                                        </p>
                                    </div>
                                    <i data-lucide="skull" className="text-teal-500/20 w-12 h-12"></i>
                                </div>

                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Pico Máximo (Daño)</p>
                                        <p className="text-3xl font-bold text-purple-400">{Math.max(...simResults.dmgData.map(d => d.dmg))}</p>
                                    </div>
                                    <i data-lucide="zap" className="text-purple-500/20 w-12 h-12"></i>
                                </div>
                            </div>
                        </div>

                        {/* CHARTS GRID */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg min-h-[400px] flex flex-col">
                                <h3 className="text-lg font-bold text-white mb-4 text-center">Distribución de Modelos Eliminados</h3>
                                <div className="flex-1 min-h-[300px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={simResults.killsData} margin={{ top: 25, right: 10, left: -20, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="killed" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                            <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(0)}%`} />
                                            <Tooltip 
                                                formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Probabilidad']}
                                                labelFormatter={(label) => `Modelos Eliminados: ${label}`}
                                                contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                                itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                            />
                                            <Bar dataKey="prob" fill="#2dd4bf" radius={[4, 4, 0, 0]}>
                                                {
                                                    simResults.killsData.map((entry, index) => {
                                                        const colors = ['#38bdf8', '#2dd4bf', '#4ade80', '#a78bfa', '#f472b6', '#fbbf24'];
                                                        return <Cell key={`cell-${index}`} fill={colors[index % colors.length]} />;
                                                    })
                                                }
                                                <LabelList dataKey="probDisplay" position="top" fill="#ffffff" fontSize={12} fontWeight="bold" />
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg min-h-[400px] flex flex-col">
                                <h3 className="text-lg font-bold text-white mb-4 text-center">Confiabilidad (Probabilidad Acumulada)</h3>
                                <div className="flex-1 min-h-[300px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={simResults.cumulativeKillsData} margin={{ top: 25, right: 10, left: -20, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="killed" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                            <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(0)}%`} domain={[0, 1]} />
                                            <Tooltip 
                                                formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Prob. Acumulada']}
                                                labelFormatter={(label) => `Al menos ${label} modelos`}
                                                contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                                itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                            />
                                            <Line type="monotone" dataKey="cumProb" stroke="#f43f5e" strokeWidth={3} dot={{ r: 6, fill: '#f43f5e', strokeWidth: 2, stroke: '#1e293b' }}>
                                                <LabelList dataKey="cumProbDisplay" position="top" fill="#f43f5e" fontSize={12} fontWeight="bold" offset={10} />
                                            </Line>
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* Chart 3 */}
                        <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg h-[350px] mb-6 flex flex-col">
                            <h3 className="text-lg font-bold text-white mb-4 text-center">Densidad del Daño Real Infligido (Neto)</h3>
                            <div className="flex-1 min-h-[250px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={simResults.dmgData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorDmg" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8}/>
                                                <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                        <XAxis dataKey="dmg" stroke="#94a3b8" tick={{fill: '#94a3b8'}} minTickGap={20} />
                                        <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(1)}%`} />
                                        <Tooltip 
                                            formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Frecuencia']}
                                            labelFormatter={(label) => `Daño Total: ${label}`}
                                            contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                            itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                            labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                        />
                                        <Area type="monotone" dataKey="densidad" stroke="#3b82f6" fillOpacity={1} fill="url(#colorDmg)" strokeWidth={2} />
                                        {params.target_wounds > 1 && (
                                            <ReferenceLine x={params.target_wounds} stroke="#ef4444" strokeDasharray="5 5" strokeWidth={2}>
                                                <Label value={`Muerte 1 Modelo (${params.target_wounds}D)`} position="insideTopLeft" fill="#ef4444" fontSize={12} fontWeight="bold" />
                                            </ReferenceLine>
                                        )}
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* IA */}
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 border border-gray-700 p-6 rounded-xl shadow-2xl relative overflow-hidden">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                                <div>
                                    <h3 className="text-xl font-bold flex items-center gap-2 text-white">
                                        <i data-lucide="cpu" className="text-purple-400 w-6 h-6"></i> Auspex Táctico (IA)
                                    </h3>
                                    <p className="text-sm text-gray-400 mt-1">
                                        Interpreta los resultados según la perspectiva de los {params.attacker_faction}.
                                    </p>
                                </div>
                                <button 
                                    onClick={generateTacticalAnalysis} 
                                    disabled={isGeneratingAI}
                                    className="bg-purple-600 hover:bg-purple-500 disabled:bg-gray-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-all flex items-center gap-2 whitespace-nowrap z-10 cursor-pointer"
                                >
                                    {isGeneratingAI ? (
                                        <><i data-lucide="activity" className="animate-spin w-4 h-4"></i> Procesando...</>
                                    ) : (
                                        <><i data-lucide="zap" className="w-4 h-4"></i> Generar Reporte</>
                                    )}
                                </button>
                            </div>

                            <div className="bg-black/40 border border-gray-700/50 p-4 rounded-lg min-h-[100px] text-gray-300 relative z-10">
                                {aiReport ? (
                                    <p className="whitespace-pre-wrap leading-relaxed text-sm md:text-base font-serif italic text-gray-200">
                                        "{aiReport}"
                                    </p>
                                ) : (
                                    <p className="text-center text-gray-500 italic mt-6">
                                        El Auspex está a la espera de inicialización. Haz clic en "Generar Reporte" para recibir el análisis de combate.
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
