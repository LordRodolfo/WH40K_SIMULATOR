<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador WH40k - Montecarlo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (UMD Stable) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- PropTypes (Requerido por Recharts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0f172a] text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            LineChart, Line, AreaChart, Area, ReferenceLine, LabelList, Label, Cell
        } = Recharts;

        const WH40K_FACTIONS = [
            "Adepta Sororitas", "Adeptus Astartes", "Adeptus Custodes", "Adeptus Mechanicus", 
            "Astra Militarum", "Caballeros del Caos", "Caballeros Grises", "Caballeros Imperiales", 
            "Cultos Genestealer", "Demonios del Caos", "Devoradores de Mundos", "Drukhari", 
            "Eldar (Aeldari)", "Guardia de la Muerte", "Imperio T'au", "Ligas de Votann", 
            "Marines Espaciales del Caos", "Mil Hijos", "Necrones", "Orkos", "Tiránidos"
        ];

        const InputSelect = ({ label, name, value, onChange, options }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-1/3">{label}</label>
                <select 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    className="w-2/3 bg-gray-900 text-white rounded p-1 text-sm border border-gray-700 focus:border-blue-500 focus:outline-none"
                >
                    {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                </select>
            </div>
        );

        const InputText = ({ label, name, value, onChange }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-1/3">{label}</label>
                <input 
                    type="text" 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    className="w-2/3 bg-gray-900 text-white rounded p-1 text-sm border border-gray-700 focus:border-blue-500 focus:outline-none"
                />
            </div>
        );

        const InputNumber = ({ label, name, value, onChange, min = 0, max = 100 }) => (
            <div className="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <label className="text-sm text-gray-300 w-2/3">{label}</label>
                <input 
                    type="number" 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    min={min}
                    max={max}
                    className="w-1/3 bg-gray-900 text-white rounded p-1 text-center font-mono border border-gray-700 focus:border-blue-500 focus:outline-none"
                />
            </div>
        );

        const Checkbox = ({ label, name, checked, onChange }) => (
            <label className="flex items-center space-x-3 cursor-pointer bg-gray-800 p-2 rounded-lg hover:bg-gray-700 transition-colors">
                <div className="relative flex items-center">
                    <input 
                        type="checkbox" 
                        name={name} 
                        checked={checked} 
                        onChange={onChange}
                        className="peer sr-only" 
                    />
                    <div className="w-5 h-5 bg-gray-900 border border-gray-600 rounded peer-checked:bg-blue-500 peer-checked:border-blue-500 transition-colors flex items-center justify-center">
                        {checked && <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
                    </div>
                </div>
                <span className="text-sm text-gray-300 font-medium">{label}</span>
            </label>
        );

        function App() {
            const [params, setParams] = useState({
                attacker_faction: "Necrones",
                attacker_name: "Lokhust Destroyers (Buffs)",
                defender_faction: "Tiránidos",
                defender_name: "Norn Emissary",
                n_models: 6,
                attacks_per_model: 3,
                bs: 3,
                wound_target: 5,
                save_target: 4,
                invuln_target: 4,
                ap: -2,
                damage: 2,
                target_wounds: 16,
                hit_modifier: -1,
                wound_modifier: 0,
                damage_modifier: 0,
                critical_hit_threshold: 5,
                critical_wound_threshold: 6,
                has_lethal_hits: true,
                sustained_hits_value: 1,
                has_devastating_wounds: false,
                fnp_target: 7,
                reroll_hits: true,
                reroll_hits_1: false,
                reroll_wounds: false,
                reroll_wounds_1: false
            });

            const [simResults, setSimResults] = useState(null);
            const [aiReport, setAiReport] = useState("");
            const [isGeneratingAI, setIsGeneratingAI] = useState(false);

            const handleParamChange = (e) => {
                const { name, value, type, checked } = e.target;
                setParams(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : (type === 'number' ? Number(value) : value)
                }));
                setAiReport("");
            };

            const simulate = () => {
                const iterations = 50000;
                const {
                    n_models, attacks_per_model, bs, wound_target, save_target, invuln_target, ap,
                    damage, target_wounds, hit_modifier, wound_modifier, damage_modifier,
                    critical_hit_threshold, critical_wound_threshold, has_lethal_hits,
                    sustained_hits_value, has_devastating_wounds, fnp_target,
                    reroll_hits, reroll_hits_1, reroll_wounds, reroll_wounds_1
                } = params;

                const effective_bs = Math.max(2, Math.min(6, bs - hit_modifier));
                const effective_wound = Math.max(2, Math.min(6, wound_target - wound_modifier));
                const modified_save = save_target - (ap < 0 ? ap : -ap);
                const effective_save = Math.min(Math.max(2, modified_save), invuln_target);
                const effective_damage = Math.max(1, damage - damage_modifier);
                const total_attacks = n_models * attacks_per_model;

                let damageCounts = {};
                let killCounts = {};
                let totalDmgSum = 0;
                let maxDmg = 0;

                for (let i = 0; i < iterations; i++) {
                    let hits = 0;
                    let critical_hits = 0;

                    for (let a = 0; a < total_attacks; a++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (reroll_hits && roll < effective_bs && roll < critical_hit_threshold) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        } else if (reroll_hits_1 && roll === 1) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        }

                        if (roll >= critical_hit_threshold) {
                            critical_hits++;
                            hits++;
                        } else if (roll >= effective_bs) {
                            hits++;
                        }
                    }

                    let extra_hits = critical_hits * sustained_hits_value;
                    let normal_hits_pool = hits - critical_hits + extra_hits;
                    if (!has_lethal_hits) normal_hits_pool += critical_hits;
                    
                    let critical_wounds = 0;
                    let normal_wounds = 0;

                    for (let w = 0; w < normal_hits_pool; w++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (reroll_wounds && roll < effective_wound && roll < critical_wound_threshold) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        } else if (reroll_wounds_1 && roll === 1) {
                            roll = Math.floor(Math.random() * 6) + 1;
                        }

                        if (roll >= critical_wound_threshold) {
                            critical_wounds++;
                        } else if (roll >= effective_wound) {
                            normal_wounds++;
                        }
                    }

                    let devastating_dmg_pool = has_devastating_wounds ? (critical_wounds * effective_damage) : 0;
                    let wounds_to_save = normal_wounds;
                    if (!has_devastating_wounds) wounds_to_save += critical_wounds;
                    if (has_lethal_hits) wounds_to_save += critical_hits;

                    let unsaved_wounds = 0;
                    for (let s = 0; s < wounds_to_save; s++) {
                        let roll = Math.floor(Math.random() * 6) + 1;
                        if (roll < effective_save) {
                            unsaved_wounds++;
                        }
                    }

                    let normal_dmg_pool = unsaved_wounds * effective_damage;
                    let final_dmg = 0;
                    let total_dmg_to_fnp = normal_dmg_pool + devastating_dmg_pool;
                    
                    if (fnp_target <= 6) {
                        for (let d = 0; d < total_dmg_to_fnp; d++) {
                            let roll = Math.floor(Math.random() * 6) + 1;
                            if (roll < fnp_target) final_dmg++;
                        }
                    } else {
                        final_dmg = total_dmg_to_fnp;
                    }

                    let models_killed = 0;
                    let dmg_allocated = final_dmg;
                    
                    while (dmg_allocated >= target_wounds) {
                        models_killed++;
                        dmg_allocated -= target_wounds;
                    }

                    damageCounts[final_dmg] = (damageCounts[final_dmg] || 0) + 1;
                    killCounts[models_killed] = (killCounts[models_killed] || 0) + 1;
                    totalDmgSum += final_dmg;
                    if (final_dmg > maxDmg) maxDmg = final_dmg;
                }

                let killsData = [];
                let cumulativeKillsData = [];
                let cumProb = 0;
                const maxKillsChart = Math.max(...Object.keys(killCounts).map(Number));

                for (let k = maxKillsChart; k >= 0; k--) {
                    let count = killCounts[k] || 0;
                    let prob = count / iterations;
                    cumProb += prob;
                    
                    killsData.unshift({
                        killed: k,
                        prob: prob,
                        probDisplay: (prob * 100).toFixed(1) + "%"
                    });

                    cumulativeKillsData.unshift({
                        killed: k,
                        cumProb: cumProb,
                        cumProbDisplay: (cumProb * 100).toFixed(1) + "%"
                    });
                }

                let dmgData = [];
                for (let d = 0; d <= maxDmg; d++) {
                    dmgData.push({
                        dmg: d,
                        densidad: (damageCounts[d] || 0) / iterations
                    });
                }

                setSimResults({
                    avgDamage: totalDmgSum / iterations,
                    killsData,
                    cumulativeKillsData: cumulativeKillsData.sort((a,b) => a.killed - b.killed),
                    dmgData,
                    iterations
                });
            };

            useEffect(() => {
                const timer = setTimeout(() => { simulate(); }, 300);
                return () => clearTimeout(timer);
            }, [params]);

            const generateTacticalAnalysis = async () => {
                setIsGeneratingAI(true);
                setAiReport("");
                
                const probKillOne = (simResults.cumulativeKillsData.find(d => d.killed === 1)?.cumProb || 0) * 100;
                const maxKills = Math.max(...simResults.killsData.filter(d => d.prob > 0).map(d => d.killed));

                const prompt = `
                    Asume el rol de un líder, comandante o entidad superior de la facción '${params.attacker_faction}' en el oscuro universo de Warhammer 40,000. 
                    Vas a evaluar un asalto táctico contra la facción enemiga '${params.defender_faction}'.
                    Analiza los siguientes resultados de una simulación de combate y proporciona un reporte táctico breve (máximo 2 párrafos).
                    
                    Contexto del Asalto: "${params.n_models} ${params.attacker_name}" (Tus fuerzas) vs "${params.defender_name}" (Fuerzas enemigas de la facción ${params.defender_faction}).
                    Fuerza Atacante: ${params.n_models} ${params.attacker_name}, efectuando ${params.attacks_per_model} ataques por modelo con Daño ${params.damage} y AP -${Math.abs(params.ap || 0)}.
                    Objetivo Enemigo: ${params.defender_name} (Heridas por modelo ${params.target_wounds}, Salvación base ${params.save_target}+, Invulnerable ${params.invuln_target}+, Feel No Pain ${params.fnp_target}+).
                    
                    Resultados de las simulaciones tácticas (50,000 iteraciones):
                    - Daño promedio infligido: ${simResults.avgDamage.toFixed(2)} puntos.
                    - Probabilidad de exterminar al menos 1 modelo enemigo: ${probKillOne.toFixed(1)}%.
                    - Bajas máximas posibles en un escenario óptimo: ${maxKills} modelos.
                    
                    Instrucciones: Evalúa si vale la pena el esfuerzo de este ataque contra el objetivo específico basándote en la probabilidad de éxito. Menciona los riesgos tácticos de que el objetivo sobreviva. 
                    CRÍTICO: Tu tono, vocabulario y actitud DEBEN corresponder estrictamente al lore de la facción '${params.attacker_faction}'. No uses saludos cordiales, mantén la atmósfera absolutamente 'grimdark' y responde en español.
                `;

                try {
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: {
                            parts: [{ text: `Eres la mente maestra táctica de la facción ${params.attacker_faction} en Warhammer 40k. Das respuestas estratégicas, inmersivas, y narrativas en español.` }]
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    setAiReport(text || "No se pudo generar el reporte táctico.");
                } catch (error) {
                    setAiReport("Error en los sistemas de comunicación (API Falló). El tecnosacerdote ha sido ejecutado.");
                } finally {
                    setIsGeneratingAI(false);
                }
            };

            if (!simResults) return <div className="min-h-screen bg-gray-950 text-white flex items-center justify-center font-mono">Cargando Motores de Lógica...</div>;

            return (
                <div className="min-h-screen bg-[#0f172a] text-gray-100 flex flex-col md:flex-row font-sans">
                    {/* SIDEBAR */}
                    <div className="w-full md:w-80 bg-gray-900 border-r border-gray-800 p-4 h-auto md:h-screen overflow-y-auto shrink-0 shadow-2xl z-10">
                        <h1 className="text-xl font-bold text-white mb-6 tracking-tight flex items-center gap-2 border-b border-gray-800 pb-4">
                            <i data-lucide="activity" className="text-blue-500 w-5 h-5"></i>
                            Simulador Montecarlo
                        </h1>

                        <div className="space-y-6">
                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="crosshair" className="w-4 h-4"></i> Atacante
                                </h2>
                                <InputSelect label="Facción Atacante" name="attacker_faction" value={params.attacker_faction} onChange={handleParamChange} options={WH40K_FACTIONS} />
                                <InputText label="Nombre Unidad" name="attacker_name" value={params.attacker_name} onChange={handleParamChange} />
                                <InputNumber label="Num. Modelos" name="n_models" value={params.n_models} onChange={handleParamChange} min={1} />
                                <InputNumber label="Ataques c/u" name="attacks_per_model" value={params.attacks_per_model} onChange={handleParamChange} min={1} />
                                <InputNumber label="HA/HP (BS/WS)" name="bs" value={params.bs} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Daño" name="damage" value={params.damage} onChange={handleParamChange} min={1} />
                                <InputNumber label="AP (Penetración)" name="ap" value={params.ap} onChange={handleParamChange} />
                            </div>

                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="shield" className="w-4 h-4"></i> Defensor
                                </h2>
                                <InputSelect label="Facción Defensora" name="defender_faction" value={params.defender_faction} onChange={handleParamChange} options={WH40K_FACTIONS} />
                                <InputText label="Nombre Unidad" name="defender_name" value={params.defender_name} onChange={handleParamChange} />
                                <InputNumber label="Tirada Herir" name="wound_target" value={params.wound_target} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Salvación Base" name="save_target" value={params.save_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Invulnerable" name="invuln_target" value={params.invuln_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Feel No Pain" name="fnp_target" value={params.fnp_target} onChange={handleParamChange} min={2} max={7} />
                                <InputNumber label="Heridas c/u" name="target_wounds" value={params.target_wounds} onChange={handleParamChange} min={1} />
                            </div>

                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="zap" className="w-4 h-4"></i> Reglas y Buffs
                                </h2>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <InputNumber label="Mod. Impacto" name="hit_modifier" value={params.hit_modifier} onChange={handleParamChange} min={-1} max={1} />
                                    <InputNumber label="Mod. Herir" name="wound_modifier" value={params.wound_modifier} onChange={handleParamChange} min={-1} max={1} />
                                </div>
                                <InputNumber label="Crítico Impacto" name="critical_hit_threshold" value={params.critical_hit_threshold} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Crítico Herir" name="critical_wound_threshold" value={params.critical_wound_threshold} onChange={handleParamChange} min={2} max={6} />
                                <InputNumber label="Sustained Hits" name="sustained_hits_value" value={params.sustained_hits_value} onChange={handleParamChange} min={0} />
                                
                                <div className="pt-2 space-y-2">
                                    <Checkbox label="Lethal Hits" name="has_lethal_hits" checked={params.has_lethal_hits} onChange={handleParamChange} />
                                    <Checkbox label="Devastating Wounds" name="has_devastating_wounds" checked={params.has_devastating_wounds} onChange={handleParamChange} />
                                    <Checkbox label="Full Reroll Impactos" name="reroll_hits" checked={params.reroll_hits} onChange={handleParamChange} />
                                    <Checkbox label="Reroll Impactos de 1" name="reroll_hits_1" checked={params.reroll_hits_1} onChange={handleParamChange} />
                                    <Checkbox label="Full Reroll Heridas" name="reroll_wounds" checked={params.reroll_wounds} onChange={handleParamChange} />
                                    <Checkbox label="Reroll Heridas de 1" name="reroll_wounds_1" checked={params.reroll_wounds_1} onChange={handleParamChange} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 p-4 md:p-8 overflow-y-auto w-full">
                        <div className="mb-8">
                            <h2 className="text-2xl md:text-3xl font-extrabold text-white mb-2">
                                {params.n_models}x {params.attacker_name} vs {params.defender_name}
                            </h2>
                            <p className="text-gray-400">
                                Basado en {simResults.iterations.toLocaleString()} iteraciones procesadas de forma nativa.
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Daño Medio Esperado</p>
                                        <p className="text-3xl font-bold text-blue-400">{simResults.avgDamage.toFixed(2)}</p>
                                    </div>
                                    <i data-lucide="activity" className="text-blue-500/20 w-12 h-12"></i>
                                </div>
                                
                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Prob. de Baja (≥1)</p>
                                        <p className="text-3xl font-bold text-teal-400">
                                            {((simResults.cumulativeKillsData.find(d => d.killed === 1)?.cumProb || 0) * 100).toFixed(1)}%
                                        </p>
                                    </div>
                                    <i data-lucide="skull" className="text-teal-500/20 w-12 h-12"></i>
                                </div>

                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-400 font-semibold uppercase">Pico Máximo (Daño)</p>
                                        <p className="text-3xl font-bold text-purple-400">{Math.max(...simResults.dmgData.map(d => d.dmg))}</p>
                                    </div>
                                    <i data-lucide="zap" className="text-purple-500/20 w-12 h-12"></i>
                                </div>
                            </div>
                        </div>

                        {/* CHARTS GRID */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg min-h-[400px] flex flex-col">
                                <h3 className="text-lg font-bold text-white mb-4 text-center">Distribución de Modelos Eliminados</h3>
                                <div className="flex-1 min-h-[300px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={simResults.killsData} margin={{ top: 25, right: 10, left: -20, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="killed" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                            <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(0)}%`} />
                                            <Tooltip 
                                                formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Probabilidad']}
                                                labelFormatter={(label) => `Modelos Eliminados: ${label}`}
                                                contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                                itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                            />
                                            <Bar dataKey="prob" fill="#2dd4bf" radius={[4, 4, 0, 0]}>
                                                {
                                                    simResults.killsData.map((entry, index) => {
                                                        const colors = ['#38bdf8', '#2dd4bf', '#4ade80', '#a78bfa', '#f472b6', '#fbbf24'];
                                                        return <Cell key={`cell-${index}`} fill={colors[index % colors.length]} />;
                                                    })
                                                }
                                                <LabelList dataKey="probDisplay" position="top" fill="#ffffff" fontSize={12} fontWeight="bold" />
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg min-h-[400px] flex flex-col">
                                <h3 className="text-lg font-bold text-white mb-4 text-center">Confiabilidad (Probabilidad Acumulada)</h3>
                                <div className="flex-1 min-h-[300px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={simResults.cumulativeKillsData} margin={{ top: 25, right: 10, left: -20, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="killed" stroke="#94a3b8" tick={{fill: '#94a3b8'}} />
                                            <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(0)}%`} domain={[0, 1]} />
                                            <Tooltip 
                                                formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Prob. Acumulada']}
                                                labelFormatter={(label) => `Al menos ${label} modelos`}
                                                contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                                itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                                labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                            />
                                            <Line type="monotone" dataKey="cumProb" stroke="#f43f5e" strokeWidth={3} dot={{ r: 6, fill: '#f43f5e', strokeWidth: 2, stroke: '#1e293b' }}>
                                                <LabelList dataKey="cumProbDisplay" position="top" fill="#f43f5e" fontSize={12} fontWeight="bold" offset={10} />
                                            </Line>
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* Chart 3 */}
                        <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow-lg h-[350px] mb-6 flex flex-col">
                            <h3 className="text-lg font-bold text-white mb-4 text-center">Densidad del Daño Real Infligido (Neto)</h3>
                            <div className="flex-1 min-h-[250px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={simResults.dmgData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorDmg" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8}/>
                                                <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                        <XAxis dataKey="dmg" stroke="#94a3b8" tick={{fill: '#94a3b8'}} minTickGap={20} />
                                        <YAxis stroke="#94a3b8" tick={{fill: '#94a3b8'}} tickFormatter={(tick) => `${(tick*100).toFixed(1)}%`} />
                                        <Tooltip 
                                            formatter={(value) => [`${(value*100).toFixed(2)}%`, 'Frecuencia']}
                                            labelFormatter={(label) => `Daño Total: ${label}`}
                                            contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #374151', borderRadius: '8px' }}
                                            itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                            labelStyle={{ color: '#9CA3AF', marginBottom: '4px' }}
                                        />
                                        <Area type="monotone" dataKey="densidad" stroke="#3b82f6" fillOpacity={1} fill="url(#colorDmg)" strokeWidth={2} />
                                        {params.target_wounds > 1 && (
                                            <ReferenceLine x={params.target_wounds} stroke="#ef4444" strokeDasharray="5 5" strokeWidth={2}>
                                                <Label value={`Muerte 1 Modelo (${params.target_wounds}D)`} position="insideTopLeft" fill="#ef4444" fontSize={12} fontWeight="bold" />
                                            </ReferenceLine>
                                        )}
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* IA */}
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 border border-gray-700 p-6 rounded-xl shadow-2xl relative overflow-hidden">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                                <div>
                                    <h3 className="text-xl font-bold flex items-center gap-2 text-white">
                                        <i data-lucide="cpu" className="text-purple-400 w-6 h-6"></i> Auspex Táctico (IA)
                                    </h3>
                                    <p className="text-sm text-gray-400 mt-1">
                                        Interpreta los resultados según la perspectiva de los {params.attacker_faction}.
                                    </p>
                                </div>
                                <button 
                                    onClick={generateTacticalAnalysis} 
                                    disabled={isGeneratingAI}
                                    className="bg-purple-600 hover:bg-purple-500 disabled:bg-gray-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-all flex items-center gap-2 whitespace-nowrap z-10 cursor-pointer"
                                >
                                    {isGeneratingAI ? (
                                        <><i data-lucide="activity" className="animate-spin w-4 h-4"></i> Procesando...</>
                                    ) : (
                                        <><i data-lucide="zap" className="w-4 h-4"></i> Generar Reporte</>
                                    )}
                                </button>
                            </div>

                            <div className="bg-black/40 border border-gray-700/50 p-4 rounded-lg min-h-[100px] text-gray-300 relative z-10">
                                {aiReport ? (
                                    <p className="whitespace-pre-wrap leading-relaxed text-sm md:text-base font-serif italic text-gray-200">
                                        "{aiReport}"
                                    </p>
                                ) : (
                                    <p className="text-center text-gray-500 italic mt-6">
                                        El Auspex está a la espera de inicialización. Haz clic en "Generar Reporte" para recibir el análisis de combate.
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
